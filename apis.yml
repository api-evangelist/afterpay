description: Afterpay is a buy-now-pay-later (BNPL) service, owned by Block, Inc., that lets shoppers split purchases into four interest-free
  installments at online and in-store retailers. Its developer portal (developers.afterpay.com) documents the Afterpay Online API for merchants
  and platforms, covering checkouts, payment auth/capture/void/refund, merchant configuration, in-store and cross-border trade, plus an llms.txt
  index and a documented MCP server for AI clients.

